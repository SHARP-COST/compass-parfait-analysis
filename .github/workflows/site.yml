name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Install environment
        run: pixi install

      - name: Bootstrap
        run: pixi run bootstrap

      - name: Setup Julia (project task)
        run: pixi run setup-julia

      - name: Instantiate Julia project
        run: pixi run instantiate

      - name: Restore cached HEPData
        id: hepdata-cache
        uses: actions/cache@v4
        with:
          path: data
          key: ${{ runner.os }}-hepdata-${{ hashFiles('scripts/fetch_data.sh') }}
          restore-keys: |
            ${{ runner.os }}-hepdata-

      - name: Fetch HEPData (cache miss only)
        if: steps.hepdata-cache.outputs.cache-hit != 'true'
        run: pixi run fetch-data

      - name: Validate cached/downloaded data (fallback fetch)
        run: |
          if [ ! -s data/transition_amplitudes.json ] || [ ! -s data/decay_phase_space_volume.json ] || [ ! -s data/covariance_matrices.tar.gz ]; then
            echo "Cached data incomplete or missing. Running fetch-data fallback."
            pixi run fetch-data
          fi
          test -s data/transition_amplitudes.json
          test -s data/decay_phase_space_volume.json
          test -s data/covariance_matrices.tar.gz

      - name: Run model
        run: pixi run run-model

      - name: Render Quarto site
        run: pixi run render-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
