name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.0

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Install environment
        run: pixi install

      - name: Bootstrap
        run: pixi run bootstrap

      - name: Setup Julia (project task)
        run: pixi run setup-julia

      - name: Instantiate Julia project
        run: pixi run instantiate

      - name: Validate versioned HEPData inputs
        run: bash scripts/fetch_data.sh --validate-only

      - name: Run tests
        run: pixi run test

      - name: Run model
        run: pixi run run-model

      - name: Build dashboard data artifacts
        run: pixi run build-dashboard-data

      - name: Render Quarto site
        run: pixi run render-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
