[project]
name = "compass-parfait-analysis"
version = "0.1.0"
description = "Reproducible workflow and public Quarto docs for COMPASS Parfait Analysis"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]
bootstrap = "bash scripts/bootstrap.sh"
setup-julia = "bash scripts/setup_julia.sh"
instantiate = "bash scripts/instantiate.sh"
fetch-data = "bash scripts/fetch_data.sh"
run-model = "julia --project=. scripts/run_model.jl"
build-dashboard-data = "julia --project=. scripts/build_dashboard_data.jl"
test = "julia --project=. test/runtests.jl"
render-site = "quarto render"

[dependencies]
bash = "*"
git = "*"
quarto = ">=1.5.0"
